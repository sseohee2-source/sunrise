<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이사회 통합관리</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#fff; --line:#e2e5ea; --text:#1d2330; --muted:#6b7280;
  --accent:#2557d6; --accent-weak:#e8eefc; --ok:#1f8a4c; --ok-weak:#e3f4ea;
  --warn:#b7791f; --warn-weak:#fdf3e1; --bad:#c53030; --bad-weak:#fde8e8;
  --written:#7c3aed; --written-weak:#f1eafe;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14171d; --panel:#1c2028; --line:#2d333e; --text:#e6e8ec; --muted:#9aa3b2;
    --accent:#6d93f2; --accent-weak:#24304a; --ok:#4cc38a; --ok-weak:#1d3328;
    --warn:#e0a84a; --warn-weak:#3a2f1c; --bad:#f07171; --bad-weak:#3d2224;
    --written:#a98bf5; --written-weak:#2d2545;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
header{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.hwrap{max-width:1200px;margin:0 auto;padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
h1{font-size:18px;margin:0 12px 0 0}
nav{display:flex;flex-wrap:wrap;gap:4px;flex:1}
nav button{border:0;background:none;padding:8px 12px;border-radius:8px;color:var(--muted);font:inherit;cursor:pointer}
nav button.on{background:var(--accent-weak);color:var(--accent);font-weight:600}
main{max-width:1200px;margin:0 auto;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.card h2{font-size:16px;margin:0 0 12px}
.card h3{font-size:14px;margin:16px 0 8px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.between{justify-content:space-between}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .l{color:var(--muted);font-size:12px}
.kpi .v{font-size:24px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{color:var(--muted);font-size:12px;margin-top:2px}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;background:var(--bg)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--accent-weak)}
.tbl{overflow-x:auto}
input,select,textarea{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
textarea{width:100%;min-height:60px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
label.f > *{font-size:14px;color:var(--text)}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.d{color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:12px}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.t-face{background:var(--accent-weak);color:var(--accent)}
.t-written{background:var(--written-weak);color:var(--written)}
.t-ok{background:var(--ok-weak);color:var(--ok)}
.t-warn{background:var(--warn-weak);color:var(--warn)}
.t-bad{background:var(--bad-weak);color:var(--bad)}
.t-mute{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.muted{color:var(--muted)}
.small{font-size:12px}
.bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;min-width:80px}
.bar > i{display:block;height:100%;background:var(--accent)}
.chart{display:flex;align-items:flex-end;gap:8px;height:180px;padding-top:20px;overflow-x:auto}
.chart .col{flex:1;min-width:44px;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.chart .col .b{width:28px;border-radius:4px 4px 0 0;background:var(--accent)}
.chart .col .b.w{background:var(--written)}
.chart .col .x{font-size:11px;color:var(--muted);white-space:nowrap}
.chart .col .y{font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.att{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.att label{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
.att label.on{border-color:var(--accent);background:var(--accent-weak)}
.empty{padding:24px;text-align:center;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--panel);padding:10px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
.print-only{display:none}
@media (max-width:640px){ .hwrap{padding:10px 16px} h1{width:100%} th,td{padding:6px} }
@media print{
  header,.noprint{display:none!important}
  .print-only{display:block}
  body{background:#fff;color:#000}
  .card{border:0;padding:0}
  input,select,textarea{border:0;padding:0;appearance:none;background:none}
}
</style>
</head>
<body>
<header><div class="hwrap">
  <h1>🏛️ 이사회 통합관리</h1>
  <nav id="nav"></nav>
  <label class="row small muted noprint">연도
    <select id="yearSel"></select>
  </label>
</div></header>
<main id="app"></main>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script>
'use strict';
// ───────────────────────── 데이터 ─────────────────────────
const KEY = 'board-mgmt-v1';
const KINDS = ['대면', '서면'];
const CATS = ['심의', '보고'];
const RESULTS = { 심의: ['원안의결', '수정의결', '부결', '보류', '철회'], 보고: ['보고완료'] };
const TABS = [['dash','대시보드'],['meetings','이사회 회차'],['agendas','안건 현황'],['remarks','주요 발언'],['directors','임원 관리'],['pay','수당 정산'],['settings','설정·백업']];
// 직위 (표시 순서 = 배열 순서)
const ROLES = {
  상임: ['이사장', '부이사장', '기획관리이사', '기업금융이사', '글로벌혁신이사', '지역혁신이사', '인력성장이사'],
  비상임: ['선임비상임이사', '비상임이사', '노동이사']
};
// 정관 제7조: 이사장 3년, 이사·감사 2년, 연임은 1년 단위, 당연직은 해당 직책 재임기간.
// 임기 만료 후에도 후임자 임명 시까지 직무 수행(계속근무).
const RENEW_YEARS = 1;
const defaultYears = role => role === '이사장' ? 3 : 2;
const TERM_OPTS = [[3, '3년 (이사장)'], [2, '2년 (이사·감사)'], [1, '1년 (연임)'], ['ex', '당연직 (직책 재임기간)'], ['', '직접 입력']];

function defaultState(){
  return {
    version: 3,
    settings: { quotaStanding: 7, quotaNon: 8, rateFace: 400000, rateWritten: 150000, payTarget: 'non', depts: [] },
    directors: [],
    meetings: []
  };
}
function load(){
  try { const r = localStorage.getItem(KEY); if (r) return normalize(JSON.parse(r)); } catch(e) {}
  return defaultState();
}
function normalize(d){
  const s = defaultState();
  d.settings = Object.assign(s.settings, d.settings || {});
  d.directors = (d.directors || []).map(x => {
    x = Object.assign({ role: '', termEnd: '', leaveDate: '', note: '', exOfficio: false }, x);
    if (!(d.version >= 2)) {
      // v1: termEnd = 실제 퇴임일, position = 직위 → v2: termEnd = 임기만료일(명목), leaveDate = 실제 퇴임일
      x.leaveDate = x.termEnd || '';
      x.termEnd = x.termStart ? termEndFrom(x.termStart, 3) : '';
      x.role = ROLES[x.type]?.includes(x.position) ? x.position : (x.type === '비상임' ? '비상임이사' : '');
      delete x.position;
    }
    return x;
  });
  // v2 → v3: 임기 3년 일괄 자동계산값을 정관 기준(이사장 3년, 그 외 2년)으로 재계산 (직접 수정한 만료일은 유지)
  if (!(d.version >= 3)) d.directors.forEach(x => {
    if (x.termStart && x.termEnd === termEndFrom(x.termStart, 3)) x.termEnd = termEndFrom(x.termStart, x.note === '연임' ? RENEW_YEARS : defaultYears(x.role));
  });
  d.version = 3;
  d.meetings = (d.meetings || []).map(m => Object.assign({ attendees: [], agendas: [], remarks: [], note: '', enrolledOverride: null }, m));
  return d;
}
let S = load();
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) { toast('저장 실패: 브라우저 저장소를 사용할 수 없습니다'); }
}
const ui = {
  tab: 'dash', year: String(new Date().getFullYear()), meetingId: null, af: { cat: '', dept: '', result: '', q: '' },
  dsub: 'status', rf: { name: '', q: '' }, asOf: new Date().toISOString().slice(0, 10), draft: null, hf: { state: '', type: '', q: '' }, bulk: false
};

// ───────────────────────── 유틸 ─────────────────────────
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won = n => (n || 0).toLocaleString('ko-KR') + '원';
const pct = (a, b) => b ? Math.round(a / b * 1000) / 10 : 0;
const today = () => new Date().toISOString().slice(0, 10);
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1800); }

const meetingName = m => `${m.year}년 제${m.seq}차 ${m.kind}이사회`;
const agendaLabel = a => `${a.category} 제${a.no}호`;
const kindTag = k => `<span class="tag ${k === '서면' ? 't-written' : 't-face'}">${esc(k)}</span>`;
function resultTag(r){
  if (!r) return '<span class="tag t-mute">미정</span>';
  const cls = { 원안의결: 't-ok', 수정의결: 't-ok', 보고완료: 't-ok', 부결: 't-bad', 보류: 't-warn', 철회: 't-mute' }[r] || 't-mute';
  return `<span class="tag ${cls}">${esc(r)}</span>`;
}
const dirById = id => S.directors.find(d => d.id === id);
const sortMeetings = arr => arr.slice().sort((a, b) => (a.date || '').localeCompare(b.date || '') || a.year - b.year || a.seq - b.seq);
const inYear = m => ui.year === 'all' || String(m.year) === ui.year;
const yearMeetings = () => sortMeetings(S.meetings.filter(inYear));

// ── 임기 ──
// 임기만료일(termEnd)은 명목상 임기(보통 3년). 실제 근무 종료는 퇴임일(leaveDate)로 관리하며,
// 임기만료 후 후임 미선임으로 계속 근무하면 퇴임일을 비워 둔다.
function termEndFrom(start, years){
  const [y, m, d] = start.split('-').map(Number);
  if (!y || !m || !d) return '';
  return new Date(Date.UTC(y + years, m - 1, d) - 864e5).toISOString().slice(0, 10);
}
function dayAfter(date, n = 1){ return new Date(Date.parse(date) + n * 864e5).toISOString().slice(0, 10); }
function monthsBetween(a, b){
  const [y1, m1, d1] = a.split('-').map(Number), [y2, m2, d2] = b.split('-').map(Number);
  return (y2 - y1) * 12 + (m2 - m1) - (d2 < d1 ? 1 : 0);
}
function fmtDur(from, to){
  const mo = Math.max(0, monthsBetween(from, to));
  if (mo < 1) return `${Math.max(0, Math.round((Date.parse(to) - Date.parse(from)) / 864e5))}일`;
  return (mo >= 12 ? `${Math.floor(mo / 12)}년 ` : '') + (mo % 12 ? `${mo % 12}개월` : '').trim();
}
const isSeated = (d, date) => (!d.termStart || d.termStart <= date) && (!d.leaveDate || d.leaveDate >= date);
function statusOn(d, date){
  if (d.termStart && d.termStart > date) return { key: 'pending', label: '임명 전', cls: 't-mute' };
  if (d.leaveDate && d.leaveDate < date) return { key: 'left', label: '퇴임', cls: 't-mute' };
  if (d.exOfficio) return { key: 'active', label: '당연직', cls: 't-ok', detail: '직책 재임기간' };
  if (d.termEnd && d.termEnd < date) return { key: 'holdover', label: '임기만료·계속근무', cls: 't-warn', detail: `만료 후 ${fmtDur(d.termEnd, date)} 경과 (후임 미선임)` };
  return { key: 'active', label: '임기 중', cls: 't-ok', detail: d.termEnd ? `잔여 ${fmtDur(date, d.termEnd)}` : '' };
}
const roleIdx = d => { const i = (ROLES[d.type] || []).indexOf(d.role); return i < 0 ? 99 : i; };
const byRole = (a, b) => (a.type === '상임' ? 0 : 1) - (b.type === '상임' ? 0 : 1) || roleIdx(a) - roleIdx(b) || (a.termStart || '').localeCompare(b.termStart || '') || a.name.localeCompare(b.name, 'ko');
const roleLabel = d => d.role || (d.type === '상임' ? '상임이사' : '비상임이사');
// 회의일 기준 재임 중인 이사 (임기만료 후 계속근무 포함)
function seatedOn(date){
  return S.directors.filter(d => isSeated(d, date));
}
function stats(m){
  const seated = seatedOn(m.date);
  const enrolled = m.enrolledOverride != null && m.enrolledOverride !== '' ? Number(m.enrolledOverride) : seated.length;
  const att = m.attendees.map(dirById).filter(Boolean);
  const attStanding = att.filter(d => d.type === '상임').length;
  const attNon = att.length - attStanding;
  const payees = S.settings.payTarget === 'all' ? att : att.filter(d => d.type === '비상임');
  const rate = Number(m.rate ?? (m.kind === '서면' ? S.settings.rateWritten : S.settings.rateFace));
  return { seated, enrolled, attended: att.length, attStanding, attNon, rate: pct(att.length, enrolled), payees, unit: rate, allowance: payees.length * rate };
}
function renumber(m){
  CATS.forEach(c => { let i = 1; m.agendas.filter(a => a.category === c).forEach(a => a.no = i++); });
}
function allDepts(){
  const set = new Set(S.settings.depts);
  S.meetings.forEach(m => m.agendas.forEach(a => a.dept && set.add(a.dept)));
  return [...set].sort((a, b) => a.localeCompare(b, 'ko'));
}

// ───────────────────────── 렌더링 ─────────────────────────
function render(){
  $('#nav').innerHTML = TABS.map(([k, l]) => `<button data-tab="${k}" class="${ui.tab === k ? 'on' : ''}">${l}</button>`).join('');
  const years = [...new Set([...S.meetings.map(m => String(m.year)), String(new Date().getFullYear())])].sort().reverse();
  if (ui.year !== 'all' && !years.includes(ui.year)) years.unshift(ui.year);
  $('#yearSel').innerHTML = `<option value="all">전체</option>` + years.map(y => `<option ${y === ui.year ? 'selected' : ''}>${y}</option>`).join('');
  if (ui.year === 'all') $('#yearSel').value = 'all';
  const views = { remarks: viewRemarks, dash: viewDash, meetings: viewMeetings, agendas: viewAgendas, directors: viewDirectors, pay: viewPay, settings: viewSettings };
  $('#app').innerHTML = views[ui.tab]();
}

function viewDash(){
  const ms = yearMeetings();
  const st = ms.map(stats);
  const face = ms.filter(m => m.kind === '대면').length;
  const ags = ms.flatMap(m => m.agendas);
  const delib = ags.filter(a => a.category === '심의');
  const avg = st.length ? Math.round(st.reduce((s, x) => s + x.rate, 0) / st.length * 10) / 10 : 0;
  const total = st.reduce((s, x) => s + x.allowance, 0);
  const now = seatedOn(today());
  const nS = now.filter(d => d.type === '상임').length, nN = now.length - nS;
  const qS = +S.settings.quotaStanding, qN = +S.settings.quotaNon;
  const resCount = RESULTS.심의.map(r => [r, delib.filter(a => a.result === r).length]).concat([['미정', delib.filter(a => !a.result).length]]);
  const yLabel = ui.year === 'all' ? '전체 기간' : ui.year + '년';

  return `
  <div class="grid kpis" style="margin-bottom:16px">
    <div class="kpi"><div class="l">이사 정원 / 현재 재적</div><div class="v">${qS + qN} / ${now.length}명</div>
      <div class="s">상임 ${nS}/${qS} · 비상임 ${nN}/${qN}${(qS + qN - now.length) > 0 ? ` · <b style="color:var(--warn)">결원 ${qS + qN - now.length}</b>` : ''}</div></div>
    <div class="kpi"><div class="l">${yLabel} 개최</div><div class="v">${ms.length}회</div><div class="s">대면 ${face} · 서면 ${ms.length - face}</div></div>
    <div class="kpi"><div class="l">${yLabel} 안건</div><div class="v">${ags.length}건</div><div class="s">심의 ${delib.length} · 보고 ${ags.length - delib.length}</div></div>
    <div class="kpi"><div class="l">평균 출석률</div><div class="v">${avg}%</div><div class="s">회차별 출석률 평균</div></div>
    <div class="kpi"><div class="l">수당 합계</div><div class="v">${won(total)}</div><div class="s">${S.settings.payTarget === 'all' ? '참석 이사 전원' : '비상임이사'} 기준</div></div>
  </div>
  <div class="two">
    <div class="card"><h2>회차별 출석률</h2>
      ${ms.length ? `<div class="chart">${ms.map((m, i) => `
        <div class="col" title="${esc(meetingName(m))} · ${st[i].attended}/${st[i].enrolled}명">
          <div class="y">${st[i].rate}%</div>
          <div class="b ${m.kind === '서면' ? 'w' : ''}" style="height:${Math.max(st[i].rate, 2) * 1.2}px"></div>
          <div class="x">${ui.year === 'all' ? String(m.year).slice(2) + '-' : ''}${m.seq}차</div>
        </div>`).join('')}</div>
        <div class="small muted" style="margin-top:8px">${kindTag('대면')} ${kindTag('서면')}</div>` : '<div class="empty">등록된 이사회가 없습니다</div>'}
    </div>
    <div class="card"><h2>심의안건 의결 결과</h2>
      ${delib.length ? `<table>${resCount.filter(r => r[1]).map(([r, n]) => `
        <tr><td style="width:90px">${resultTag(r === '미정' ? '' : r)}</td><td><div class="bar"><i style="width:${pct(n, delib.length)}%"></i></div></td><td class="n" style="width:90px">${n}건 (${pct(n, delib.length)}%)</td></tr>`).join('')}</table>`
        : '<div class="empty">심의안건이 없습니다</div>'}
    </div>
  </div>
  <div class="card"><div class="row between"><h2>회차 목록</h2><button class="btn p noprint" data-act="newMeeting">+ 이사회 등록</button></div>
    ${meetingTable(ms.slice().reverse())}
  </div>`;
}

function meetingTable(ms){
  if (!ms.length) return '<div class="empty">등록된 이사회가 없습니다. “+ 이사회 등록”으로 시작하세요.</div>';
  return `<div class="tbl"><table>

function filteredAgendas(){
  const f = ui.af, q = f.q.trim().toLowerCase();
  const out = [];
  yearMeetings().forEach(m => m.agendas.forEach(a => {
    if (f.cat && a.category !== f.cat) return;
    if (f.dept && a.dept !== f.dept) return;
    if (f.result && (f.result === '미정' ? a.result : a.result !== f.result)) return;
    if (q && !(`${a.title} ${a.dept} ${a.note}`.toLowerCase().includes(q))) return;
    out.push({ m, a });
  }));
  return out;
}

    ${list.length ? `<div class="tbl"><table>
      <thead><tr><th>회차</th><th>일자</th><th>구분</th><th>번호</th><th>안건명</th><th>담당부서</th><th>결과</th></tr></thead>

      </tbody></table></div>` : '<div class="empty">조건에 맞는 안건이 없습니다</div>'}
  </div>
  ${list.length ? `<div class="card"><h2>부서별 안건 수</h2><div class="tbl"><table>
    <thead><tr><th>담당부서</th><th class="n">심의</th><th class="n">보고</th><th class="n">합계</th></tr></thead>
    <tbody>${Object.entries(byDept).sort((a, b) => (b[1].심의 + b[1].보고) - (a[1].심의 + a[1].보고)).map(([d, c]) => `
      <tr><td>${esc(d)}</td><td class="n">${c.심의}</td><td class="n">${c.보고}</td><td class="n"><b>${c.심의 + c.보고}</b></td></tr>`).join('')}</tbody>
  </table></div></div>` : ''}`;
}

function remarkRows(){
  const f = ui.rf, q = f.q.trim().toLowerCase(), out = [];
  yearMeetings().forEach(m => m.remarks.forEach(r => {
    const d = dirById(r.directorId), a = m.agendas.find(x => x.id === r.agendaId);

    if (q && !`${r.content} ${r.answer} ${a ? a.title : ''} ${d ? d.name : ''}`.toLowerCase().includes(q)) return;
    out.push({ m, r, d, a });
  }));
  return out;
}

  </div>

    <h2>${sel ? `${esc(sel.name)} ${esc(roleLabel(sel))} 주요 발언` : '임원 주요 발언'} <span class="small muted">(${ui.year === 'all' ? '전체 기간' : ui.year + '년'} · ${rows.length}건)</span></h2>
    ${rows.length ? `<div class="tbl"><table>

      <tbody>${rows.map(({ m, r, d, a }) => `<tr class="click" data-open="${m.id}" style="vertical-align:top">

        <td class="small" style="min-width:120px">${a ? `<b>${agendaLabel(a)}</b><br>${esc(a.title)}` : '<span class="muted">일반/기타</span>'}</td>

      </tbody></table></div>` : '<div class="empty">조건에 맞는 발언이 없습니다. 이사회 회차 화면의 “주요 발언”에서 등록하세요.</div>'}
  </div>`;

function directorStats(){
  const ms = yearMeetings();
  const sts = ms.map(m => [m, stats(m)]);
  return S.directors.map(d => {
    let eligible = 0, attended = 0, pay = 0;
    sts.forEach(([m, s]) => {
      const seated = s.seated.some(x => x.id === d.id);
      const att = m.attendees.includes(d.id);
      if (seated || att) eligible++;
      if (att) attended++;
      if (s.payees.some(x => x.id === d.id)) pay += s.unit;
    });
    return { d, eligible, attended, rate: pct(attended, eligible), pay };
  });
}
const fmtDate = s => s ? s.replace(/-/g, '.') : '';
const endLabel = d => d.exOfficio ? '<span class="muted">당연직</span>' : fmtDate(d.termEnd);
function quickDates(){
  const t = today(), [y, m] = t.split('-').map(Number);
  const endOf = (yy, mm) => new Date(Date.UTC(yy, mm, 0)).toISOString().slice(0, 10); // mm: 1~12
  const q = Math.floor((m - 1) / 3) * 3;
  return [['오늘', t], ['전월말', m > 1 ? endOf(y, m - 1) : endOf(y - 1, 12)], ['전분기말', q ? endOf(y, q) : endOf(y - 1, 12)], ['6월말', endOf(y, 6)], ['전년말', endOf(y - 1, 12)]];
}
function viewDirectors(){
  const subs = [['status', '기준일 임원 현황'], ['history', '역대 임원 명단'], ['attend', '개인별 출석률']];
  const body = { status: viewStatus, history: viewHistory, attend: viewAttend }[ui.dsub]();
  return `<div class="row noprint" style="margin-bottom:12px;gap:4px">${subs.map(([k, l]) => `<button class="btn ${ui.dsub === k ? 'p' : ''}" data-act="dsub" data-k="${k}">${l}</button>`).join('')}</div>${body}`;
}

function viewStatus(){
  const date = ui.asOf || today();
  const seated = seatedOn(date).sort(byRole);
  const st = seated.filter(d => d.type === '상임'), non = seated.filter(d => d.type === '비상임');
  const qS = +S.settings.quotaStanding, qN = +S.settings.quotaNon;
  const hold = seated.filter(d => statusOn(d, date).key === 'holdover');
  const soon = seated.filter(d => d.termEnd && d.termEnd >= date && d.termEnd <= dayAfter(date, 90));
  let no = 0;
  const row = (d, type, role) => {
    if (!d) return `<tr><td class="n muted">-</td><td>${type}이사</td><td><b>${role}</b></td><td colspan="5" class="muted">공석</td></tr>`;
    const s = statusOn(d, date);
    return `<tr class="click" data-edit="${d.id}"><td class="n">${++no}</td><td>${d.type}이사</td><td><b>${esc(roleLabel(d))}</b></td><td><b>${esc(d.name)}</b></td>
      <td>${fmtDate(d.termStart)}</td><td>${endLabel(d)}</td>
      <td><span class="tag ${s.cls}">${s.label}</span> <span class="small muted">${s.detail || ''}</span></td><td class="small">${esc(d.note)}</td></tr>`;
  };
  // 상임: 직위별 1석 (공석 표시), 직위 미지정자는 뒤에
  const stRows = ROLES.상임.map(r => { const p = st.filter(d => d.role === r); return p.length ? p.map(d => row(d, '상임')).join('') : row(null, '상임', r); }).join('')
    + st.filter(d => !ROLES.상임.includes(d.role)).map(d => row(d, '상임')).join('');
  const nonRows = non.map(d => row(d, '비상임')).join('') + (qN > non.length ? `<tr><td class="n muted">-</td><td>비상임이사</td><td colspan="6" class="muted">결원 ${qN - non.length}명</td></tr>` : '');
  const dup = ROLES.상임.filter(r => st.filter(d => d.role === r).length > 1);
  return `
  <div class="card noprint">
    <div class="row">
      <label class="f">기준일<input type="date" data-asof value="${esc(date)}"></label>

function curMeeting(){ return S.meetings.find(x => x.id === ui.meetingId); }
function newMeeting(){
  const y = ui.year === 'all' ? new Date().getFullYear() : Number(ui.year);
  const seq = Math.max(0, ...S.meetings.filter(m => m.year === y).map(m => m.seq)) + 1;
  const date = String(y) === today().slice(0, 4) ? today() : `${y}-01-01`;
  const m = { id: uid(), year: y, seq, date, kind: '대면', rate: S.settings.rateFace, enrolledOverride: null, attendees: [], agendas: [], remarks: [], note: '' };
  S.meetings.push(m); save();
  ui.tab = 'meetings'; ui.meetingId = m.id; render();
}
function moveAgenda(m, id, dir){
  const a = m.agendas.find(x => x.id === id);
  const same = m.agendas.filter(x => x.category === a.category);
  const j = same.indexOf(a) + dir;
  if (j < 0 || j >= same.length) return;
  const i1 = m.agendas.indexOf(a), i2 = m.agendas.indexOf(same[j]);
  [m.agendas[i1], m.agendas[i2]] = [m.agendas[i2], m.agendas[i1]];
  renumber(m);
}

function csv(name, rows){
  const body = rows.map(r => r.map(v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }).join(',')).join('\r\n');
  download(name, '﻿' + body, 'text/csv;charset=utf-8');
}
function download(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const yTag = () => ui.year === 'all' ? '전체' : ui.year;

// 새 임기 등록 시, 같은 상임 직위(또는 같은 사람)의 재직 중인 전임 기록에 퇴임일(새 임기 시작 전날)을 채운다
function closePredecessors(rec){
  const prev = S.directors.filter(d => d.id !== rec.id && d.termStart && d.termStart < rec.termStart
    && (!d.leaveDate || d.leaveDate >= rec.termStart)
    && ((d.name === rec.name && d.type === rec.type) || (rec.type === '상임' && d.type === '상임' && d.role && d.role === rec.role)));
  if (!prev.length) return;
  const end = dayAfter(rec.termStart, -1);
  if (confirm(`전임 기록의 퇴임일을 ${fmtDate(end)}로 입력할까요?\n\n` + prev.map(d => `· ${d.name} (${roleLabel(d)}, 임기 ${fmtDate(d.termStart)}~${fmtDate(d.termEnd)})`).join('\n')))
    prev.forEach(d => d.leaveDate = end);
}
function parseDate(v){
  v = String(v || '').trim(); if (!v) return '';
  let m = v.match(/^(\d{4})(\d{2})(\d{2})$/) || v.match(/^(\d{2,4})\D+(\d{1,2})\D+(\d{1,2})/);
  if (!m) return null;
  let y = +m[1]; if (y < 100) y += 2000;
  const s = `${y}-${String(m[2]).padStart(2, '0')}-${String(m[3]).padStart(2, '0')}`;
  return isNaN(Date.parse(s)) ? null : s;
}
function parseBulk(text){
  const recs = [], errors = [];
  text.split(/\r?\n/).forEach((line, i) => {
    if (!line.trim()) return;
    const c = (line.includes('\t') ? line.split('\t') : line.split(',')).map(x => x.trim());
    if (i === 0 && /성명|이름/.test(c[0])) return;
    const [name, typeRaw, roleRaw, s, e, l, note] = c;
    const n = `${i + 1}행`;
    let type = /^비상임/.test(typeRaw) ? '비상임' : /^상임/.test(typeRaw) ? '상임' : '';
    let role = (roleRaw || '').replace(/\s/g, '');
    if (!type) type = ROLES.비상임.includes(role) ? '비상임' : ROLES.상임.includes(role) ? '상임' : '';
    if (!name) return errors.push(`${n}: 성명 없음`);
    if (!type) return errors.push(`${n}: 구분(상임/비상임) 확인 필요`);
    if (!ROLES[type].includes(role)) {
      if (!role && type === '비상임') role = '비상임이사';
      else return errors.push(`${n}: 직위 "${roleRaw || ''}" 확인 필요 (${ROLES[type].join('/')})`);
    }
    const termStart = parseDate(s), termEnd = parseDate(e), leaveDate = parseDate(l);
    if (!termStart) return errors.push(`${n}: 임기 시작일 확인 필요`);
    if (termEnd === null || leaveDate === null) return errors.push(`${n}: 날짜 형식 확인 필요`);
    const ex = /당연직/.test(note || '');
    recs.push({ id: uid(), name, type, role, termStart, termEnd: ex ? '' : termEnd || termEndFrom(termStart, /연임/.test(note || '') ? RENEW_YEARS : defaultYears(role)), leaveDate: leaveDate || '', note: note || '', exOfficio: ex });
  });
  return { recs, errors };
}

document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.rf === 'q') { ui.rf.q = t.value; const pos = t.selectionStart; render(); const n = document.querySelector('[data-rf="q"]'); n.focus(); n.setSelectionRange(pos, pos); return; }
  if (t.dataset.hf === 'q') { ui.hf.q = t.value; const pos = t.selectionStart; render(); const n = document.querySelector('[data-hf="q"]'); n.focus(); n.setSelectionRange(pos, pos); return; }
  if (t.dataset.df && ui.draft && !['type', 'role', 'termStart', 'years'].includes(t.dataset.df)) { ui.draft[t.dataset.df] = t.value; return; }
  if (t.dataset.af === 'q') { ui.af.q = t.value; const pos = t.selectionStart; render(); const n = document.querySelector('[data-af="q"]'); n.focus(); n.setSelectionRange(pos, pos); }
});
document.addEventListener('change', e => {
  const t = e.target, v = t.value;
  if (t.id === 'yearSel') { ui.year = v; ui.meetingId = null; render(); return; }
  if (t.dataset.af && t.dataset.af !== 'q') { ui.af[t.dataset.af] = v; render(); return; }
  if (t.dataset.asof !== undefined) { if (v) { ui.asOf = v; render(); } return; }
  if (t.dataset.hf && t.dataset.hf !== 'q') { ui.hf[t.dataset.hf] = v; render(); return; }
  if (t.dataset.df && ui.draft) {
    const f = ui.draft, k = t.dataset.df;
    const recalc = () => { if (f.years === 'ex') f.termEnd = ''; else if (f.years !== '' && f.termStart) f.termEnd = termEndFrom(f.termStart, f.years); };
    if (k === 'type' || k === 'role') {
      if (k === 'type') { f.type = v; if (!ROLES[v].includes(f.role)) f.role = ROLES[v][0]; } else f.role = v;
      if (!f._renew && f.years !== 'ex') f.years = defaultYears(f.role);
      recalc(); render();
    }
    else if (k === 'termStart') { f.termStart = v; recalc(); render(); }
    else if (k === 'years') { f.years = v === '' || v === 'ex' ? v : Number(v); recalc(); render(); }
    else f[k] = v;
    return;
  }
  if (t.dataset.set) {
    const k = t.dataset.set;
    S.settings[k] = k === 'depts' ? v.split('\n').map(s => s.trim()).filter(Boolean) : k === 'payTarget' ? v : Number(v) || 0;
    save(); toast('저장했습니다'); return;
  }
  const m = curMeeting();
  if (t.dataset.m && m) {
    const k = t.dataset.m;
    if (k === 'year' || k === 'seq') m[k] = Number(v) || m[k];
    else if (k === 'rate') m.rate = Number(v) || 0;
    else if (k === 'enrolledOverride') m.enrolledOverride = v === '' ? null : Number(v);
    else if (k === 'kind') {
      const oldDefault = m.kind === '서면' ? S.settings.rateWritten : S.settings.rateFace;
      m.kind = v;
      if (Number(m.rate) === Number(oldDefault)) m.rate = v === '서면' ? S.settings.rateWritten : S.settings.rateFace;
    }
    else m[k] = v;
    const dup = S.meetings.find(x => x !== m && x.year === m.year && x.seq === m.seq);
    if (dup && (k === 'year' || k === 'seq')) toast(`주의: ${m.year}년 제${m.seq}차가 이미 있습니다`);
    if (k === 'year' && ui.year !== 'all') ui.year = String(m.year);
    save(); if (k !== 'note') render(); return;
  }
  if (t.dataset.att && m) {
    const id = t.dataset.att;
    m.attendees = t.checked ? [...new Set([...m.attendees, id])] : m.attendees.filter(x => x !== id);
    save(); render(); return;
  }
  if (t.dataset.rm && m) {
    const r = m.remarks.find(x => x.id === t.dataset.rm); r[t.dataset.k] = v; save(); return;
  }
  if (t.dataset.rf && t.dataset.rf !== 'q') { ui.rf[t.dataset.rf] = v; render(); return; }
  if (t.dataset.ag && m) {
    const a = m.agendas.find(x => x.id === t.dataset.ag); a[t.dataset.k] = v.trim ? v.trim() : v;
    save(); if (t.dataset.k === 'result' || t.dataset.k === 'dept') render(); return;
  }
});
$('#fileIn').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || !Array.isArray(d.meetings) || !Array.isArray(d.directors)) throw new Error('형식 오류');
      if (!confirm(`백업 파일을 불러올까요? (이사 ${d.directors.length}명, 이사회 ${d.meetings.length}회)\n현재 데이터는 덮어씌워집니다.`)) return;

    } catch(err) { alert('백업 파일을 읽을 수 없습니다: ' + err.message); }
    e.target.value = '';
  };
  r.readAsText(f);
});

  people.forEach(([name, type, role, termStart, leaveDate, note]) => s.directors.push({ id: uid(), name, type, role, termStart, termEnd: termEndFrom(termStart, note === '연임' ? RENEW_YEARS : defaultYears(role)), leaveDate, note }));
  const plan = [
    ['2026-01-28', '대면', [['2026년도 사업계획 및 예산(안)', '기획조정실', '원안의결'], ['직제규정 일부개정규정(안)', '인사총무부', '수정의결']], [['2025년도 4분기 경영실적', '경영지원부']]],
    ['2026-02-25', '서면', [['2025회계연도 결산(안)', '재무회계부', '원안의결']], []],
    ['2026-03-26', '대면', [['2026년 임원 성과계약(안)', '인사총무부', '원안의결'], ['자산 취득 승인(안)', '재무회계부', '보류'], ['보수규정 일부개정(안)', '인사총무부', '수정의결']], [['2025년도 내부감사 결과', '감사실'], ['리스크관리 현황', '기획조정실']]],
    ['2026-05-20', '서면', [['차입금 한도 변경(안)', '재무회계부', '원안의결']], [['1분기 경영실적', '경영지원부']]],
    ['2026-07-22', '대면', [['자산 취득 승인(안) 재상정', '재무회계부', '원안의결'], ['중장기 경영목표 수정(안)', '기획조정실', '수정의결']], [['상반기 사업 추진실적', '사업운영부'], ['2분기 경영실적', '경영지원부']]],
    ['2026-09-17', '대면', [['2027년도 예산편성 지침(안)', '기획조정실', '원안의결'], ['취업규칙 개정(안)', '인사총무부', '']], [['3분기 내부감사 결과', '감사실']]]
  ];
  plan.forEach(([date, kind, del, rep], i) => {
    const m = { id: uid(), year: 2026, seq: i + 1, date, kind, rate: kind === '서면' ? 150000 : 400000, enrolledOverride: null, attendees: [], agendas: [], remarks: [], note: '' };
    const seated = s.directors.filter(d => isSeated(d, date));
    m.attendees = seated.filter((d, j) => (j * 7 + i * 3) % 10 > (kind === '서면' ? 0 : 1)).map(d => d.id);
    del.forEach(([t, d, r]) => m.agendas.push({ id: uid(), category: '심의', no: 0, title: t, dept: d, result: r, note: '' }));
    rep.forEach(([t, d]) => m.agendas.push({ id: uid(), category: '보고', no: 0, title: t, dept: d, result: '보고완료', note: '' }));
    renumber(m);
    const talk = [
      ['한지민', 0, '예산 증액분의 산출 근거와 중장기 재무 영향 분석 자료 보완 요청', '차기 이사회 보고 시 재무영향 분석 자료 제출 예정 (기획조정실)'],
      ['장동민', 1, '규정 개정에 따른 직원 근로조건 변경 여부 및 노조 의견수렴 절차 확인', '근로조건 불이익 변경 없음. 노사협의회 사전 설명 완료'],
      ['오세훈', 0, '자산 취득 시 감정평가 복수 실시 필요', '복수 감정평가 후 재상정하기로 함'],
      ['서지우', 0, '성과지표 중 정량지표 비중 확대 검토 요청', '의견 반영하여 수정']
    ];
    const [who, ai, c, ans] = talk[i % talk.length];
    const d = seated.find(x => x.name === who) || seated[0];
    if (!m.attendees.includes(d.id)) m.attendees.push(d.id);
    m.remarks = [{ id: uid(), directorId: d.id, agendaId: (m.agendas[ai] || m.agendas[0]).id, content: c, answer: ans }];
    s.meetings.push(m);
  });
  return s;
}

render();
</script>
